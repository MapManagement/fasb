[package]
name = "fasb"
version = "0.2.9"
edition = "2024"
authors = ["drwadu"]
description = "fasb - faceted answer set browser"
repository = "https://github.com/drwadu/fasb"
license = "MIT"

[dependencies]
rustyline = "11.0.0"
regex = "1"
savan = "0.3.5"
indicatif = "0.17.11"
lru = "0.12"
pyo3 = "0.28.3"

[features]
interpreter = []
extension-module = ["pyo3/extension-module"]

[lib]
name = "fasb"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fasb"
path = "src/bin.rs"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
